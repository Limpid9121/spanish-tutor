<!doctype html>
<html lang="zh-Hant" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>西語家教</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="西語家教">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<script src="vendor/ts-fsrs.umd.js"></script>
</head>
<body>
<div id="app" aria-live="polite"></div>
<nav id="tabbar" aria-label="主選單">
  <a href="#/today" data-tab="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3.5v3M15 3.5v3"/></svg>
    <span>今日</span>
  </a>
  <a href="#/vocab" data-tab="vocab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H19v14H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></svg>
    <span>單字</span>
  </a>
  <a href="#/settings" data-tab="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h9M18 8h1M5 16h1M10 16h9"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg>
    <span>設定</span>
  </a>
</nav>
<div id="toast" role="status"></div>
<noscript><p style="padding:2rem">這個 App 需要開啟 JavaScript。</p></noscript>
<script>
// 開機看門狗：8 秒後內容區還是空的（程式沒載入、或儲存空間一直沒回應），就顯示說明，不要讓畫面一直空白。
(function () {
  var MSG = "載入比預期久。請完全關掉再重新開啟；如果一直這樣，可能是另一個開著的分頁擋住了儲存空間，請把其他分頁都關掉。";
  function show() { var a = document.getElementById("app"); if (a && !a.firstElementChild) { var p = document.createElement("p"); p.className = "empty"; p.textContent = MSG; a.appendChild(p); } }
  setTimeout(show, 8000);
  window.__bootFail = show;
})();
</script>
<script type="module" src="js/main.js" onerror="window.__bootFail&&window.__bootFail()"></script>
</body>
</html>
